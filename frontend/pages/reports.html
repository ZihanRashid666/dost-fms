<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports — DOST FMS</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <h1>Reports</h1>
      <div class="topbar-actions">
        <button class="btn btn-outline" onclick="window.print()">🖨️ Print</button>
      </div>
    </div>
    <div class="content">
      <div class="card" style="margin-bottom:16px;padding:14px 20px;">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <div class="form-group" style="margin:0"><label>From</label><input type="date" id="from" value=""></div>
          <div class="form-group" style="margin:0"><label>To</label><input type="date" id="to" value=""></div>
          <button class="btn btn-primary" onclick="loadReport()" style="margin-top:16px">Generate Report</button>
        </div>
      </div>

      <div id="report-output">
        <div class="empty-state"><div class="icon">📈</div>Select a date range and click Generate Report.</div>
      </div>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>
<script>
  requireAuth();
  document.getElementById('sidebar').innerHTML = buildSidebar('reports');
  // Default dates
  const today = new Date().toISOString().split('T')[0];
  const monthAgo = new Date(Date.now()-30*86400000).toISOString().split('T')[0];
  document.getElementById('from').value = monthAgo;
  document.getElementById('to').value   = today;

  async function loadReport() {
    const from = document.getElementById('from').value;
    const to   = document.getElementById('to').value;
    const res  = await api.get(`/work-orders/report?from=${from}&to=${to}`);

    const byStatus   = res.by_status   || {};
    const byPriority = res.by_priority || {};

    document.getElementById('report-output').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card accent"><div class="label">Total Work Orders</div><div class="value">${res.total}</div><div class="sub">${from} to ${to}</div></div>
        <div class="stat-card danger"><div class="label">SLA Breaches</div><div class="value">${res.sla_breaches}</div><div class="sub">Out of ${res.total} total</div></div>
        <div class="stat-card success"><div class="label">Avg Resolution Time</div><div class="value">${res.avg_resolution ? Math.round(res.avg_resolution)+'h' : '—'}</div><div class="sub">Hours to complete</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card">
          <div class="card-title">By Status</div>
          <table><tbody>
            ${Object.entries(byStatus).map(([k,v]) => `<tr><td>${badge(k)}</td><td style="text-align:right"><strong>${v}</strong></td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="card">
          <div class="card-title">By Priority</div>
          <table><tbody>
            ${Object.entries(byPriority).map(([k,v]) => `<tr><td>${badge(k)}</td><td style="text-align:right"><strong>${v}</strong></td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>`;
  }
</script>
</body>
</html>
