<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — DOST FMS</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>DOST <span class="dot">FMS</span></h1>
      <p>Facility Management System</p>
      <p style="font-size:11px;color:var(--muted);margin-top:4px;">Department of Science and Technology — Philippines</p>
    </div>
    <div id="alert-box"></div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="yourname@dost.gov.ph" autocomplete="email">
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()" id="login-btn">
      Sign In
    </button>
    <div style="margin-top:20px;padding:14px;background:#f0f4f8;border-radius:8px;font-size:12px;color:var(--muted);">
      <strong>Demo Credentials:</strong><br>
      Admin: admin@dost.gov.ph / password<br>
      Manager: manager@dost.gov.ph / password<br>
      Staff: maintenance@dost.gov.ph / password
    </div>
  </div>
</div>
<script src="../assets/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('alert-box');
    const btn      = document.getElementById('login-btn');

    if (!email || !password) { showAlert(alertBox, 'Please enter email and password.'); return; }

    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
      const res = await api.post('/auth/login', { email, password });
      Auth.setSession(res.token, res.user);
      window.location.href = 'dashboard.html';
    } catch(e) {
      showAlert(alertBox, e.data?.message || 'Login failed. Check your credentials.');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
