<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Management — DOST FMS</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <h1>User Management</h1>
      <div class="topbar-actions">
        <input type="text" id="search" placeholder="Search users…" style="width:200px" oninput="loadUsers()">
        <select id="f-role" onchange="loadUsers()" style="width:160px">
          <option value="">All Roles</option>
          <option value="system_admin">System Admin</option>
          <option value="facility_manager">Facility Manager</option>
          <option value="maintenance_staff">Maintenance Staff</option>
          <option value="requestor">Requestor</option>
          <option value="viewer">Viewer</option>
        </select>
        <button class="btn btn-primary" onclick="openNew()">+ New User</button>
      </div>
    </div>
    <div class="content">
      <div id="alert-box"></div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
            <tbody id="users-tbody"><tr><td colspan="8" class="text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="user-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">New User</h3>
      <button class="modal-close" onclick="closeModal('user-modal')">✕</button>
    </div>
    <div id="modal-alert"></div>
    <input type="hidden" id="user-id">
    <div class="form-grid">
      <div class="form-group"><label>Full Name *</label><input id="f-name" placeholder="Juan dela Cruz"></div>
      <div class="form-group"><label>Email *</label><input type="email" id="f-email" placeholder="juan@dost.gov.ph"></div>
      <div class="form-group"><label>Password <span id="pw-hint" style="color:var(--muted)">(required)</span></label><input type="password" id="f-password" placeholder="Min 8 characters"></div>
      <div class="form-group"><label>Role *</label>
        <select id="f-role-modal">
          <option value="system_admin">System Admin</option>
          <option value="facility_manager">Facility Manager</option>
          <option value="maintenance_staff">Maintenance Staff</option>
          <option value="requestor" selected>Requestor</option>
          <option value="viewer">Viewer</option>
        </select>
      </div>
      <div class="form-group"><label>Department</label><input id="f-dept" placeholder="e.g. Research, IT, Finance"></div>
      <div class="form-group"><label>Contact No.</label><input id="f-contact" placeholder="09XX-XXX-XXXX"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('user-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Save User</button>
    </div>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script>
  requireAuth();
  if (!Auth.hasRole('system_admin')) window.location.href = 'dashboard.html';
  document.getElementById('sidebar').innerHTML = buildSidebar('users');

  async function loadUsers() {
    let url = '/users?';
    const s = document.getElementById('search').value;
    const r = document.getElementById('f-role').value;
    if (s) url += `search=${encodeURIComponent(s)}&`;
    if (r) url += `role=${r}`;
    const res  = await api.get(url);
    const users = res.data || [];
    const tbody = document.getElementById('users-tbody');
    if (!users.length) { tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon">👥</div>No users found.</div></td></tr>'; return; }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td><code style="font-size:12px;background:#f0f4f8;padding:2px 6px;border-radius:4px">${u.user_code}</code></td>
        <td><strong>${u.full_name}</strong></td>
        <td>${u.email}</td>
        <td>${badge(u.role.replace(/_/g,' '), u.is_active ? 'approved' : 'inactive')}</td>
        <td>${u.department||'—'}</td>
        <td><span class="badge ${u.is_active?'badge-active':'badge-inactive'}">${u.is_active?'Active':'Inactive'}</span></td>
        <td>${formatDate(u.last_login_at)}</td>
        <td style="display:flex;gap:4px">
          <button class="btn btn-outline btn-sm" onclick="editUser(${u.user_id})">Edit</button>
          <button class="btn btn-sm ${u.is_active?'btn-danger':'btn-outline'}" onclick="toggleStatus(${u.user_id})">${u.is_active?'Deactivate':'Activate'}</button>
        </td>
      </tr>`).join('');
  }

  function openNew() {
    document.getElementById('user-id').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-email').value = '';
    document.getElementById('f-password').value = '';
    document.getElementById('f-dept').value = '';
    document.getElementById('f-contact').value = '';
    document.getElementById('modal-title').textContent = 'New User';
    document.getElementById('pw-hint').textContent = '(required)';
    openModal('user-modal');
  }

  async function editUser(id) {
    const u = await api.get(`/users/${id}`);
    document.getElementById('user-id').value      = u.user_id;
    document.getElementById('f-name').value        = u.full_name;
    document.getElementById('f-email').value       = u.email;
    document.getElementById('f-password').value    = '';
    document.getElementById('f-role-modal').value  = u.role;
    document.getElementById('f-dept').value        = u.department||'';
    document.getElementById('f-contact').value     = u.contact_no||'';
    document.getElementById('modal-title').textContent = 'Edit User';
    document.getElementById('pw-hint').textContent = '(leave blank to keep)';
    openModal('user-modal');
  }

  async function saveUser() {
    const id = document.getElementById('user-id').value;
    const payload = {
      full_name:  document.getElementById('f-name').value,
      email:      document.getElementById('f-email').value,
      role:       document.getElementById('f-role-modal').value,
      department: document.getElementById('f-dept').value,
      contact_no: document.getElementById('f-contact').value,
    };
    const pw = document.getElementById('f-password').value;
    if (pw) payload.password = pw;
    try {
      if (id) await api.put(`/users/${id}`, payload);
      else    await api.post('/users', payload);
      closeModal('user-modal');
      showAlert(document.getElementById('alert-box'), 'User saved.', 'success');
      loadUsers();
    } catch(e) {
      showAlert(document.getElementById('modal-alert'), Object.values(e.data?.errors||{}).flat().join(' ')||'Save failed.');
    }
  }

  async function toggleStatus(id) {
    await api.patch(`/users/${id}/toggle-status`);
    showAlert(document.getElementById('alert-box'), 'Status updated.', 'success');
    loadUsers();
  }

  loadUsers();
</script>
</body>
</html>
